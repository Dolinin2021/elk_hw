filebeat.inputs:
  - type: filestream
    id: nginx-access-log
    enabled: true
    paths:
      - /var/log/nginx/access.log

setup.ilm.enabled: false
setup.template.name: "filebeat-nginx"
setup.template.pattern: "filebeat-nginx-*"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "filebeat-nginx-%{+yyyy.MM.dd}"
