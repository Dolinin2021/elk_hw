services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: es-hw
    environment:
      - discovery.type=single-node
      - cluster.name=dolinin-random-cluster-2026
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - elk-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: kibana-hw
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk-net

  nginx:
    image: nginx:alpine
    container_name: nginx-hw
    ports:
      - "8080:80"
    volumes:
      - ./nginx-logs:/var/log/nginx
    command: >
      /bin/sh -c "rm -f /var/log/nginx/access.log /var/log/nginx/error.log &&
      nginx -g 'daemon off;'"
    networks:
      - elk-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.0
    container_name: logstash-hw
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./nginx-logs:/var/log/nginx:ro
    depends_on:
      - elasticsearch
      - nginx
    networks:
      - elk-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    container_name: filebeat-hw
    user: root
    command: filebeat -e
    profiles:
      - filebeat
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./nginx-logs:/var/log/nginx:ro
    depends_on:
      - elasticsearch
      - nginx
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge
